# =============================================================================
# oai-o1-adapter values
# Derived from the working KVM config.json, adapted for in-cluster deployment.
# The ONLY value that MUST change vs the KVM setup is smo.advertisedHost (was
# 192.168.8.78, the KVM). In-cluster it must be the address SMO/SDNC uses to
# reach THIS adapter — your MetalLB LB IP (same pool as your OCUDU OAM LB).
# =============================================================================

namespace: ravi-ns

image:
  repository: bmw.ece.ntust.edu.tw/ravi/oai-o1-adapter
  tag: dev-v3
  pullPolicy: Always

replicaCount: 1

# --- Scheduling -------------------------------------------------------------
# The adapter is NOT a radio function: do not pin it to radio/NUMA cores.
# Leave empty to let the scheduler place it on any worker. Pin only if needed.
nodeSelector: {}
tolerations: []
affinity: {}

# --- How SMO (SDNC) reaches THIS adapter (northbound) ------------------------
# advertisedHost is written into config.json network.host and announced in
# pnfRegistration; SDNC then dials back into it for the NETCONF mount, so it
# MUST be routable from 192.168.8.69.
smo:
  advertisedHost: ""       # REQUIRED: MetalLB LB IP (LoadBalancer) or node IP (NodePort)
  netconfPort: 1830        # port SMO connects to for NETCONF  (LoadBalancer: any; NodePort: 30000-32767)
  sftpPort: 1222           # port SMO connects to for SFTP PM pull (same rule)

service:
  type: LoadBalancer       # LoadBalancer (recommended, mirrors OCUDU) or NodePort
  loadBalancerIP: ""       # LoadBalancer only; normally == smo.advertisedHost

# --- VES (adapter -> SMO collector, outbound) -------------------------------
ves:
  url: "http://192.168.8.69:30417/eventListener/v7"
  username: sample1
  password: sample1
  pnfRegistration: true
  heartbeatInterval: 30
  fileExpiry: 86400
  pmDataInterval: 30

# --- Telnet (adapter -> gNB, southbound) ------------------------------------
# Points at the gNB telnet NodePort on joule (proven). gNB must run with
# --telnetsrv --telnetsrv.shrmod o1 --telnetsrv.listenport 9090, exposed via a
# NodePort 30090 -> gNB pod :9090. See README for a ClusterIP alternative.
telnet:
  host: "192.168.206.82"   # joule node IP
  port: 30090              # gNB telnet NodePort -> gNB :9090

# --- NETCONF credentials (must match image-baked netconf user) --------------
netconf:
  username: netconf
  password: "netconf!"

# --- Alarms -----------------------------------------------------------------
alarms:
  internalConnectionLostTimeout: 3
  loadDownlinkWarnThreshold: 50
  loadDownlinkWarnTimeout: 30

# --- Managed-element identity (from your working config) --------------------
info:
  gnbDuId: 3602
  gnbCuId: 0
  cellLocalId: 1
  granularityPeriod: 0
  fileReportingPeriod: 0
  nodeId: "oai-gnb-00"
  locationName: "NTUST BMW Lab, ECE, Taipei"
  managedBy: "ManagementSystem=O-RAN-SC-ONAP-based-SMO"
  managedElementType: "gNB-DU"
  model: "nr-softmodem"
  unitType: "gNB"

logLevel: 3
softwareVersion: "abcd"

# --- PM file storage --------------------------------------------------------
# false -> emptyDir (PM XML lost on restart, fine if DFC pulls promptly)
# true  -> PVC (durable PM files across restarts)
pmStorage:
  enabled: false
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"
